   <!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>King Bug.md | Pair Your Device</title>  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
    rel="stylesheet"
  >  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Orbitron', sans-serif;
      color: #0f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-shadow: 0 0 5px #0f0;
      padding: 20px;
    }

    .container {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid #0f0;
      border-radius: 15px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 20px;
    }

    p {
      margin: 10px 0;
      font-size: 0.9em;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #000;
      color: #0f0;
      border: 1px solid #0f0;
      border-radius: 8px;
      outline: none;
      font-family: 'Orbitron', sans-serif;
    }

    input::placeholder {
      color: #0f0;
      opacity: 0.55;
    }

    button {
      background: #0f0;
      color: #000;
      font-weight: bold;
      font-family: 'Orbitron', sans-serif;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
      width: 100%;
    }

    button:hover {
      background: #00ff41;
      transform: scale(1.03);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    #status {
      margin-top: 15px;
      min-height: 20px;
      font-size: 0.8em;
    }

    .success {
      color: #00ff41;
    }

    .error {
      color: #ff3333;
      text-shadow: 0 0 5px #ff3333;
    }

    .code {
      margin-top: 15px;
      padding: 14px;
      border: 1px solid #0f0;
      border-radius: 8px;
      background: rgba(0, 255, 0, 0.08);
      font-size: 1.4em;
      letter-spacing: 4px;
      word-break: break-all;
      display: block;
    }

    .pairing-card {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid rgba(0, 255, 0, 0.65);
      border-radius: 8px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .pairing-card p {
      font-size: 0.75em;
    }

    .backend {
      margin-top: 8px;
      color: #777;
      font-size: 0.65em;
      text-shadow: none;
      word-break: break-all;
    }
  </style></head><body>  <div class="container"><h1>🔐 KING BUG.MD</h1>

<p>
  Enter your WhatsApp number to get pairing code.
</p>

<p>
  <small>Owner: +2348161796121</small>
</p>

<input
  type="text"
  placeholder="Enter phone number e.g. 234816xxxxxx"
  id="number"
  inputmode="numeric"
  autocomplete="tel"
/>

<button id="pairButton" onclick="getPairingCode()">
  GET PAIRING CODE
</button>

<div id="status"></div>
<div id="pairings"></div>

<p style="margin-top: 15px;">
  <small>Powered by Dark Cyber Team</small>
</p>

<div class="backend">
  Backend:
  <span id="backendUrl"></span>
</div>

  </div>  <script>

    /*
     * ==========================================================
     * RENDER BACKEND
     * ==========================================================
     *
     * Replace the URL below with your actual Render URL.
     *
     * Example:
     *
     * const RENDER_URL = "https://king-bug-md.onrender.com";
     *
     * Do NOT add a trailing slash.
     */

    const RENDER_URL =
      "https://king-bug-back.onrender.com";


    const numberInput = document.getElementById("number");
    const pairButton = document.getElementById("pairButton");
    const statusBox = document.getElementById("status");
    const pairingsBox = document.getElementById("pairings");
    const backendUrl = document.getElementById("backendUrl");

    const pairingSessions = new Map();
    let pairingHeartbeatTimer = null;

    backendUrl.textContent = RENDER_URL;


    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = type;
    }


    function cleanNumber(number) {
      return number.replace(/\D/g, "");
    }


    function addPairingCard(pairingId, number, code, codeVersion = 1) {
      const existing = pairingSessions.get(pairingId);
      if (existing) {                      // resumed session: reuse its card
        existing.codeElement.textContent = code;
        existing.codeVersion = codeVersion;
        return;
      }
      const card = document.createElement("div");
      card.className = "pairing-card";
      const heading = document.createElement("p");
      heading.textContent = `Number: +${number}`;
      const codeElement = document.createElement("div");
      codeElement.className = "code";
      codeElement.textContent = code;
      const statusElement = document.createElement("p");
      statusElement.className = "success";
      statusElement.textContent = "Pairing code active. Enter it on WhatsApp → Linked devices → Link with phone number instead.";
      card.append(heading, codeElement, statusElement);
      pairingsBox.prepend(card);

      const session = { pairingId, number, codeElement, statusElement, codeVersion, timer: null, polling: false, failures: 0 };
      pairingSessions.set(pairingId, session);
      session.timer = setInterval(() => pollPairingStatus(session), 2000);
      pollPairingStatus(session);
    }

    function stopPolling(session) {
      clearInterval(session.timer);
      session.timer = null;
    }

    async function pollPairingStatus(session) {
      if (!session?.pairingId || session.polling) return;
      session.polling = true;
      try {
        const response = await fetch(
          `${RENDER_URL}/api/pair/status?id=${encodeURIComponent(session.pairingId)}&t=${Date.now()}`,
          { headers: { "Accept": "application/json", "Cache-Control": "no-cache" }, cache: "no-store" }
        );
        const data = await response.json().catch(() => ({}));

        if (response.status === 404) {
          session.statusElement.textContent = data.error || "Pairing session not found or expired. Generate a new code.";
          session.statusElement.className = "error";
          stopPolling(session);
          return;
        }
        if (!response.ok) return;          // server busy/restarting: keep trying
        session.failures = 0;

        // The server may have had to issue a NEW code (WhatsApp resets unclaimed
        // pre-auth connections). Always show the latest one.
        if (data.code && data.codeVersion !== session.codeVersion) {
          session.codeVersion = data.codeVersion;
          session.codeElement.textContent = data.code;
          session.statusElement.textContent = "🔄 New pairing code issued — use this one.";
          session.statusElement.className = "success";
          return;
        }

        if (data.status === "open") {
          session.statusElement.textContent = "✅ Device paired successfully. Status message sent; the bot is joining the configured group.";
          session.statusElement.className = "success";
          stopPolling(session);
          return;
        }

        // Only these are final. "restarting" and "linking" are normal steps.
        if (data.terminal) {
          session.statusElement.textContent = data.error || "Pairing session ended. Generate a new code.";
          session.statusElement.className = "error";
          stopPolling(session);
          return;
        }

        session.statusElement.textContent = data.message || `Pairing session: ${data.status || "connecting"}…`;
        session.statusElement.className = "success";
      } catch (error) {
        session.failures += 1;             // network blip: never end the session because of it
        console.debug("Pairing status poll failed:", error);
      } finally {
        session.polling = false;
      }
    }

    function startPairingHeartbeat() {
      if (pairingHeartbeatTimer) return;
      // This makes the pairing page send light inbound traffic while it is open,
      // which helps a free Render service stay awake during a pairing session.
      pairingHeartbeatTimer = setInterval(async () => {
        try {
          await fetch(`${RENDER_URL}/health?pairing=1&t=${Date.now()}`, {
            headers: { "Accept": "application/json" }, cache: "no-store"
          });
        } catch {}
      }, 5 * 60 * 1000);
    }

    async function getPairingCode() {

      const number = cleanNumber(numberInput.value);

      if (!number) {
        setStatus(
          "Please enter your WhatsApp number.",
          "error"
        );
        return;
      }


      if (number.length < 10 || number.length > 15) {
        setStatus(
          "Please enter a valid number with country code.",
          "error"
        );
        return;
      }


      if (RENDER_URL.includes("YOUR-RENDER-SERVICE")) {
        setStatus(
          "Render backend URL has not been configured yet.",
          "error"
        );
        return;
      }


      pairButton.disabled = true;
      pairButton.textContent = "CONNECTING...";
      setStatus(`Requesting a separate pairing session for +${number}…`, "");
      startPairingHeartbeat();

      try {

        const response = await fetch(
          `${RENDER_URL}/api/pair?number=${encodeURIComponent(number)}`,
          {
            method: "GET",
            headers: {
              "Accept": "application/json"
            },
            cache: "no-store"
          }
        );


        let data;

        try {
          data = await response.json();
        } catch {
          data = {};
        }


        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            `Server error (${response.status})`
          );
        }


        const pairingCode =
          data.code ||
          data.pairingCode ||
          data.pairing_code;


        if (pairingCode) {

          if (!data.pairingId) throw new Error("Server did not return a pairing session ID.");
          addPairingCard(data.pairingId, number, pairingCode, data.codeVersion || 1);
          setStatus(`Pairing code generated for +${number}. You can request another number while this one is pairing.`, "success");


        } else {

          setStatus(
            data.message ||
            "Server responded, but no pairing code was returned.",
            "error"
          );

        }

      } catch (error) {

        console.error("Pairing error:", error);

        setStatus(
          error.message ||
          "Unable to connect to the Render server.",
          "error"
        );

      } finally {

        pairButton.disabled = false;
        pairButton.textContent = "GET PAIRING CODE";

      }
    }


    numberInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        getPairingCode();
      }

    });

    window.addEventListener("beforeunload", () => {
      clearInterval(pairingHeartbeatTimer);
      for (const session of pairingSessions.values()) clearInterval(session.timer);
    });

  </script></body>
</html>
